<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangulated Bodice</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --ink: #e8e6e1; --dim: #9aa0aa;
    --line: #2d313a; --accent: #d98b4a;
    --bar-h: 36px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #view { position: fixed; inset: 0; }
  #hud, #help {
    position: fixed; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    backdrop-filter: blur(6px); max-width: 52ch;
  }
  #hud { left: 12px; top: var(--bar-h); margin-top: 12px; }
  #help { left: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }
  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  table { border-collapse: collapse; }
  td { padding: 1px 0; }
  td:first-child { color: var(--dim); padding-right: 14px; white-space: nowrap; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .warn { color: #e0674f; }
  .ok { color: #7bbf6a; }
  kbd { background: #2a2e36; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  #busy { position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(20,22,26,.7); font-size: 14px; color: var(--accent); z-index: 10; }
  /* lil-gui at 75% larger than its defaults, which are tuned for a dense
     developer panel rather than something you use while holding a tape measure */
  .lil-gui {
    --font-size: 19px;
    --input-font-size: 18px;
    --widget-height: 35px;
    --padding: 7px;
    --spacing: 7px;
    --folder-indent: 12px;
    --slider-input-min-width: 79px;
    --color-input-min-width: 79px;
    --scrollbar-width: 9px;
    --slider-knob-width: 4px;
    --widget-border-radius: 3px;
  }
  .lil-gui.root > .title { font-size: 20px; padding: 10px 14px; }
  .lil-gui .title { font-size: 19px; }

  #hud { font-size: 15px; }
  #hud h1 { font-size: 16px; }
  #help { font-size: 14px; }


  /* ------------------------------------------------ menubar and dialogs */
  .menubar {
    position: fixed; left: 0; top: 0; right: 0; height: var(--bar-h); z-index: 5000;
    display: flex; align-items: stretch; gap: 2px; padding: 0 6px;
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
    overflow-x: auto; scrollbar-width: thin;
  }
  .menubar-brand {
    display: flex; align-items: center; padding: 0 12px 0 4px; color: var(--accent);
    font-size: 15px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  }
  .menubar-item {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink);
    font: inherit; font-size: 15px; padding: 0 12px; white-space: nowrap; cursor: pointer;
  }
  .menubar-item:hover { background: #262a33; }
  .menubar-item.on { border-bottom-color: var(--accent); color: var(--accent); }

  .dlg {
    position: fixed; z-index: 1100; border: 1px solid var(--line); border-radius: 6px;
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,.45); overflow: hidden;
  }
  .dlg-bar {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: move;
    background: #22262e; border-bottom: 1px solid var(--line); user-select: none;
  }
  .dlg.collapsed .dlg-bar { border-bottom: 0; }
  .dlg-title { flex: 1; font-size: 15px; color: var(--accent); letter-spacing: .03em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlg-fold, .dlg-close {
    background: none; border: 0; color: var(--dim); font: inherit; font-size: 16px;
    line-height: 1; padding: 2px 6px; cursor: pointer; border-radius: 3px;
  }
  .dlg-fold:hover, .dlg-close:hover { background: #343a45; color: var(--ink); }
  .dlg-body { overflow-y: auto; }   /* the height is set as it is placed */
  /* a lil-gui living inside a dialog: the dialog already has the title bar */
  .dlg-body .lil-gui.root { width: 100% !important; }
  .dlg-body .lil-gui.root > .title { display: none; }
  .dlg-body .lil-gui > .children { border: 0; }

  /* the autoplaced panel starts below the bar */
  .lil-gui.autoPlace { top: var(--bar-h); max-height: calc(100vh - var(--bar-h)); }

  @media (max-width: 760px) { #help { display: none; } #hud { font-size: 12px; max-width: 30ch; } }
</style>
</head>
<body>
  <div id="view"></div>
  <div id="hud"><h1>Triangulated Bodice</h1><div id="stats">loading…</div></div>
  <div id="help">
    <kbd>drag</kbd> orbit &nbsp; <kbd>wheel</kbd> zoom &nbsp; <kbd>R</kbd> rebuild
    &nbsp; <kbd>space</kbd> relax 20 &nbsp; <kbd>Q</kbd> quantise
    &nbsp; <kbd>S</kbd> settle &nbsp; <kbd>G</kbd> grow &nbsp; <kbd>T</kbd> try on &nbsp; <kbd>I</kbd> import &nbsp; <kbd>P</kbd> pattern SVG &nbsp; <kbd>E</kbd> OBJ
    &nbsp; <kbd>C</kbd> colour mode
  </div>
  <div id="busy">working…</div>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
      "lil-gui": "./vendor/three/lil-gui.module.min.js"
  } }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
