<!doctype html><meta charset="utf-8"><title>probe2</title>
<body><pre id="log">…</pre>
<script type="module">
const L=[]; const say=s=>{L.push(s);document.getElementById('log').textContent=L.join('\n');};
window.onerror=(m,f,l)=>say(`ERROR ${m} @${f}:${l}`);
try{
const { Body } = await import('./js/body.js');
const { flaredSkirtPattern, waistRing } = await import('./js/skirt.js');
const { layOut } = await import('./js/assemble.js');
const { Cloth } = await import('./js/cloth.js');
const arrange = await import('./js/arrange.js');
const b=new Body(), waistV=b.landmarkV('waist');
const ring=waistRing(b,{waistV,ease:1.0});
const pattern=flaredSkirtPattern({panels:4,waistCm:ring.circumferenceCm,
  circleFraction:0.5,lengthCm:50,edge:6.0,waistV});
const laid=layOut(pattern,b,{standoffCm:6});
const sim=new Cloth(laid.asm,b,{fabric:'linen',gravityScale:0,stitches:laid.stitches,
  selfCollision:false,substeps:6,sewSpeedCmPerSec:4});
sim.stitchStrength=1;
const inSel=s=>new Set([...s]);
const step=n=>{for(let i=0;i<n;i++)sim.step(1/60);};

// W: start pass 1 on pieces 0+1
let sel=inSel([0,1]);
sim.startSewing(st=>sel.has(st.pa)&&sel.has(st.pb));
say(`W pressed: ${sim.remainingFeedCm().toFixed(1)} cm to take up at 4 cm/s`);
let g0=sim.maxStitchGap(); step(60);
say(`after 1 s: gap ${sim.maxStitchGap().toFixed(2)} cm (closed ${(g0-sim.maxStitchGap()).toFixed(2)} cm -- should be ~4)`);
// W again: stop
sim.stopSewing();
const frozen=sim.maxStitchGap();
say(`W pressed again: stopped at ${frozen.toFixed(2)} cm. isSewing=${sim.isSewing()}`);
say(`  (viewer sets playing=false here, so nothing steps and it stays put)`);

// now MOVE a sewn piece, as the buttons do
arrange.nudge(laid.placements, [1], 'station', 20);
arrange.applyPlacements(laid.asm, pattern, laid.placements, laid.axis, laid.offsets, [1]);
for (const st of sim.stitches) { sim.vel[st.a][0]=0; }
const afterMove=sim.maxStitchGap();
const retied=sim.retieStitches(st=>st.pa===1||st.pb===1);
say(`moved piece 1 by 20 deg: gap now ${afterMove.toFixed(1)} cm, re-tied ${retied} threads`);

// W again: resume. does it lurch?
sim.startSewing(st=>sel.has(st.pa)&&sel.has(st.pb));
let worst=0, prev=sim.maxStitchGap();
for(let f=1;f<=400;f++){ sim.step(1/60);
  if(f%10===0){ const g=sim.maxStitchGap(); worst=Math.max(worst,(prev-g)/(10/60)); prev=g; }
  if(!sim.isSewing()) break; }
say(`resumed and finished at t=${sim.time.toFixed(1)}s: gap ${sim.maxStitchGap().toFixed(3)} cm`);
say(`  fastest closing rate seen after the move: ${worst.toFixed(2)} cm/s (commanded 4)`);

// pass 2
sel=inSel([1,2]);
const n2=sim.startSewing(st=>sel.has(st.pa)&&sel.has(st.pb));
say(`\nW on pieces 1+2: armed ${n2}, ${sim.remainingFeedCm().toFixed(1)} cm to go`);
const held=sim.stitches.filter(s=>s.active&&!s.feeding);
let openedMost=0;
for(let f=0;f<600;f++){ sim.step(1/60);
  openedMost=Math.max(openedMost,...held.map(s=>sim.stitchGap(s)));
  if(!sim.isSewing()) break; }
say(`pass 2 done: all armed gaps <= ${Math.max(...sim.stitches.filter(s=>s.active).map(s=>sim.stitchGap(s))).toFixed(3)} cm`);
say(`pass 1's seam opened at most ${openedMost.toFixed(3)} cm meanwhile`);
for(const r of sim.stitchReport({closedCm:0.25})) say(`  ${r.seam} ${r.sewing.padEnd(6)} gap=${String(r.maxGapCm).padStart(6)} ${r.verdict}`);
say('PROBE2 OK');
}catch(e){say(`THREW ${e&&e.stack||e}`);}
</script>
